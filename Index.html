<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketchums Labs - Quantara Dashboard</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050505;
            font-family: 'Courier New', Courier, monospace; color: #00ffcc;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .dashboard-ui { position: absolute; z-index: 10; padding: 20px; pointer-events: none; }
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; text-align: right; }
        h1 { margin: 0 0 5px 0; font-size: 1.2rem; letter-spacing: 2px; color: #ffffff; }
        p { margin: 0; font-size: 0.8rem; color: #888888; }
        .status-active { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="dashboard-ui top-left">
        <h1>KETCHUMS QUANTUM PHYSICS LABS</h1>
        <p>Engine Status: <span class="status-active">POWERED BY QUANTARA</span></p>
    </div>
    <div class="dashboard-ui top-right">
        <h1>SWARM SECURITY OVERVIEW</h1>
        <p id="token-display">Click to Connect Wallet to Quantara Node Network</p>
    </div>

    <!-- Corrected root module loading -->
    <script type="module" src="app.js"></script>
</body>
</html>
